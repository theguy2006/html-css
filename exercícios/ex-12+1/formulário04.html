<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.</title>
</head>
<body>
    <h1>formulário 4</h1>
    <form action="arquivo.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">email</label>
                <input type="email" name="email" id="iemail" required placeholder="E-mail">
                <p>
                    <label for="itel">telefone</label>
                    <input type="tel" name="tel" id="itel" autocomplete="tel" required
                    pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)-xxxx-xxxx">
                </p>
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>
</html>
