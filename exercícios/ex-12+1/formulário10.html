<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>form</h1>
    <form action="arquivo.php" method="post">
        <p>
            <label for="iyear">When do you was born? </label>
            <input type="number" name="year" id="iyear" min="1900" max="2024" oninput="calcidade()">
        </p>
        <p>
            <label for="iidade">yout age is</label>
            <output id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p>
    </form>
    <script>
        function calcidade() {
            let current = new Date().getFullYear()
            iidade.innerHTML = Number(current) - Number(iyear.value)
        }
    </script>

</body>
</html>
