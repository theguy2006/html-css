<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            font-size: 25px;
        }
    </style>
  </head>
  <body>
    <h1>teste de formulário</h1>
    <form action="arquivo.php" method="post" autocomplete="on">
      <p>
        <label for="inome">nome</label>
        <input
          type="text"
          name="nome"
          id="inome"
          required
          maxlength="30"
          placeholder="Nome completo"
          autocomplete="name"
        />
      </p>
      <p>
        <label for="imedia">média</label>
        <input
          type="number"
          name="média"
          id="imedia"
          min="0"
          max="10"
          placeholder="0 a 10"
          step="0.1" value="0"
          required
        />
      </p>

      <p>
        <label for="imes">Período letivo</label>
        <input type="month" name="mes" id="imes" value="2027-01" required>
      </p>

      <p>
        <input type="submit" value="entrar" />
        <input type="reset" value="limpar" />
      </p>
      <p>
        <label for="idata">Dia da prova</label>
        <input type="date" name="data" id="idata" required>
      </p>
    </form>
  </body>
</html>
