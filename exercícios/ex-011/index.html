<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 600px;
            border-collapse: collapse; 
            border: 8px solid darkgreen;
            
        }
        td{
            border: 2px solid black;
            padding: 10px;
        }
        .linha{
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    
        <!-- HIERARQUIA DE TABELAS (SIMPLES)
        TABLE = TABELA
        TABLE ROWS = linhas de tabela
            TABLE HEADER = CABELHO DE TABELA
            TABLE DATA = DADO DE TABELA -->
    <table>
        <tr class="linha"> <!--PRIMEIRA LINHA-->
            <td>A1</td>
            <TD>B1</TD>
            <TD>C1</TD>
        </tr>
        <tr>
            <td>A2</td> <!--SEGUNDA LINHA-->
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td> <!--TERCEIRA LINHA-->
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td> <!--QUARTA LINHA-->
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
