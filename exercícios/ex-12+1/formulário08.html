<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Formulary</h1>
    <form action="arquivo.php" method="post" autocomplete="on">
      <p>
        <label for="inumb">Number 1</label>
        <input
          type="number"
          name="number"
          id="inumber"
          min="0"
          max="50"
          required
          oninput="
            isoma.innerHTML = Number(inumber.value) + Number(inumber2.value)
          "
        />
      </p>
      <p>
        <label for="inumb">Number 2</label>
        <input
          type="number"
          name="number2"
          id="inumber2"
          min="0"
          max="50"
          required
          oninput="
            isoma.innerHTML = Number(inumber.value) + Number(inumber2.value)
          "
        />
      </p>
      <p>
        <label for="isoma">Soma</label>
        <output id="isoma">0</output>
      </p>
      <input type="submit" value="submit" />
      <input type="reset" value="reset" />
    </form>
  </body>
</html>
