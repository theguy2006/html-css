<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        form{
            text-align: center;
        }
        label{
            background-color: rgb(0, 106, 255);
            padding: 5px;
            border-radius: 10px;
        }
        label:hover{
            color: white;
            transition:color 0.5s;
        }
        ::placeholder{
            text-align: center;
        }
    </style>
  </head>
  <body>
    <h1>formulário 2</h1>
    <form action="arquivo.php" method="post" autocomplete="on">
      <p>
        <label for="iusu">usuário</label>
        <input type="text" name="usu" id="isu" required mixlength="10" maxlength="50" size="15" placeholder="nome do usuário" />
      </p>
      <p>
        <label for="isen">senha</label>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="15" placeholder="sua senha" />
      </p>
      <p>
        <input type="submit" value="send">
        <input type="reset" value="clean">
      </p>
    </form>
  </body>
</html>
